<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Setup</title>
<script>try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f7; --surface: #fff; --surface2: #f2f2f5; --hover: #ebebf0; --line: #e5e5ea; --line2: #d6d6de;
    --text: #111116; --muted: #6b6b76; --faint: #9c9ca7; --accent: #5b4cff; --ok: #16a34a; --warn: #d97706; --err: #dc2626;
    --shadow: 0 1px 2px rgba(17,17,22,.04), 0 6px 24px rgba(17,17,22,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --bg: #09090b; --surface: #131316; --surface2: #1b1b20; --hover: #222228; --line: #24242a; --line2: #33333b; --text: #f4f4f6; --muted: #9a9aa6; --faint: #6c6c78; --accent: #7c6cff; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --shadow: 0 8px 28px rgba(0,0,0,.35); }
  }
  :root[data-theme="dark"] { color-scheme: dark; --bg: #09090b; --surface: #131316; --surface2: #1b1b20; --hover: #222228; --line: #24242a; --line2: #33333b; --text: #f4f4f6; --muted: #9a9aa6; --faint: #6c6c78; --accent: #7c6cff; --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --shadow: 0 8px 28px rgba(0,0,0,.35); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14.5px/1.6 Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  .wrap { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; padding: 0 8px 18px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #ff1f4b, #7c5cff); display: grid; place-items: center; color: #fff; font-size: 13px; }
  .brand small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
  .steps a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--muted); font-weight: 600; text-decoration: none; cursor: pointer; }
  .steps a:hover { background: var(--hover); color: var(--text); }
  .steps a.on { background: var(--surface2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .steps .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--surface2); border: 1px solid var(--line2); flex: none; }
  .steps a.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
  .steps .opt { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--faint); text-transform: uppercase; }
  .foot { margin-top: auto; display: flex; gap: 6px; }
  main { padding: 40px 48px 120px; max-width: 920px; }
  h1 { font-size: 28px; letter-spacing: -.025em; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 26px; font-size: 15px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px 22px; margin-bottom: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 15px; }
  ol.how { margin: 0; padding: 0; list-style: none; counter-reset: s; }
  ol.how > li { counter-increment: s; position: relative; padding: 0 0 16px 40px; }
  ol.how > li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
  ol.how > li b { font-weight: 700; }
  code, .copy { background: var(--surface2); border: 1px solid var(--line); padding: 1px 7px; border-radius: 6px; font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .copy { cursor: pointer; display: inline-flex; gap: 6px; align-items: center; padding: 3px 8px; }
  .copy:hover { border-color: var(--accent); }
  .copy::after { content: "⧉"; color: var(--muted); }
  .copy.done::after { content: "✓"; color: var(--ok); }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.sm { padding: 5px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .nav { display: flex; justify-content: space-between; margin-top: 24px; }
  input, select { background: var(--surface); border: 1px solid var(--line2); color: var(--text); border-radius: 9px; padding: 8px 11px; font: inherit; width: 100%; outline: none; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .form { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 10px 14px; align-items: center; }
  .form label { color: var(--muted); font-size: 13.5px; }
  .check { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .check:first-child { border-top: 0; }
  .check .d { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
  .check .d.ok { background: var(--ok); } .check .d.warn { background: var(--warn); } .check .d.err { background: var(--err); }
  .check .t { flex: 1; } .check .s { color: var(--muted); font-size: 13px; }
  .status { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 700; }
  .status.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .status.no { color: var(--muted); background: var(--surface2); }
  .msg { margin-top: 10px; font-size: 13.5px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .drop { border: 1.5px dashed var(--line2); border-radius: 14px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
  .note { color: var(--muted); font-size: 13px; }
  .tip { border-left: 3px solid var(--accent); padding: 8px 14px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border-radius: 0 10px 10px 0; font-size: 13.5px; margin: 10px 0; }
  .warnbox { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
  pre { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; max-height: 340px; }
  .card.support { display: flex; gap: 18px; align-items: center; text-decoration: none; color: var(--text); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, #ff3d7f 10%, var(--surface)), color-mix(in srgb, var(--accent) 12%, var(--surface))); transition: transform .15s; }
  .card.support:hover { transform: translateY(-2px); }
  .card.support .heart { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; background: var(--surface); box-shadow: var(--shadow); flex: none; }
  .seg { display: inline-flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  @media (max-width: 860px) {
    .wrap { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 24px 16px 100px; }
    .form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <div class="brand"><span class="logo">▶</span><div>Studio<small id="tagline"></small></div></div>
    <nav class="steps" id="steps"></nav>
    <div class="foot">
      <div class="seg" id="langSeg"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
      <a class="btn sm" href="/" id="toDash" style="margin-left:auto"></a>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
const $ = (s) => document.querySelector(s);
const api = (url, body, method) => fetch(url, { method: method ?? (body ? "POST" : "GET"), headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined }).then((r) => r.json());
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const getLang = () => { try { return localStorage.getItem("setupLang") || (navigator.language.startsWith("fr") ? "fr" : "en"); } catch { return "fr"; } };
let L = getLang();
let ST = null;
let step = Number(location.hash.slice(1)) || 0;
const copy = (t) => `<span class="copy" data-copy="${esc(t)}">${esc(t)}</span>`;
const ext = (url, label) => `<a href="${url}" target="_blank" rel="noopener">${label ?? url.replace(/^https:\/\//, "")} ↗</a>`;

/* ------------------------------------------------------------------ textes FR / EN */
const T = {
  fr: {
    tagline: "Guide d'installation", dash: "Dashboard →", next: "Continuer →", prev: "← Retour", skip: "Passer cette étape →", optional: "option",
    acc: { h: "Un compte par langue", fallback: (o) => `publie sur le compte ${o}`, none: "aucun compte", connect: (l) => `Connecter le compte ${l}`, change: "Changer", forget: "Retirer", forgetQ: (l) => `Retirer le compte ${l} ? Ses vidéos partiront sur l'autre compte s'il existe.` },
    steps: ["Bienvenue", "Ton profil", "Tes apps", "YouTube", "TikTok", "Photos TikTok", "Dossier TikTok", "Instagram", "Voix off", "C'est prêt", "Soutenir le dév"],
    s0: { h: "Bienvenue 👋", lead: "En quelques étapes, tu vas connecter ta chaîne YouTube, ton compte TikTok et ton Instagram. Tout reste sur ton ordinateur : tes clés sont enregistrées dans le dossier <code>data/</code>, jamais envoyées ailleurs.",
      checks: "Vérification de ton ordinateur", node: "Node.js", ffmpeg: "ffmpeg (encodage vidéo)", python: "Python + numpy/scipy (musique)", ocr: "OCR du système (lecture des slides TikTok)", claude: "Claude Code CLI (légendes automatiques)", say: "Voix du système (Shorts narrés)",
      missing: "Relance <code>./install.sh</code> (Mac) ou <code>install.ps1</code> (Windows) pour installer ce qui manque.", claudeNote: "Facultatif : sans Claude Code, l'import de dossiers TikTok fonctionne mais sans légendes écrites automatiquement. Installe-le sur claude.com/claude-code." },
    s1: { h: "Ton profil", lead: "Ton prénom s'affiche sur le dashboard ; la signature est ajoutée en bas de chaque description YouTube.",
      name: "Prénom", sigFr: "Signature FR (tu)", sigFrV: "Signature FR (vous)", sigEn: "Signature EN", save: "Enregistrer", saved: "Enregistré ✓",
      ph: { name: "Alex", fr: "Fait avec ❤️ par Alex, développeur indépendant. Abonne-toi pour voir mes autres apps !", frv: "… Abonnez-vous pour voir mes autres apps !", en: "Made with ❤️ by Alex, indie developer. Subscribe to see my other apps!" } },
    s2: { h: "Tes apps", lead: "Chaque app = un fichier <code>content/apps/&lt;slug&gt;.json</code> + ses captures dans <code>public/apps/&lt;slug&gt;/</code>. Les vidéos (Shorts, 16:9, série Keynote) sont générées à partir de ce fichier.",
      found: "Apps trouvées", how: "Ajouter ton app",
      list: [

        "Mets ton icône (<code>icon.png</code>, 1024×1024) et tes captures d'écran (PNG, idéalement 1290×2796) dans <code>public/apps/monapp/</code>, avec les noms utilisés dans le JSON (<code>features[].screens</code>, <code>keynote.details[].src</code>).",

    s3: { h: "YouTube", lead: "La plateforme envoie tes vidéos en <b>privé programmé</b> : c'est YouTube qui les publie à l'heure prévue. Il faut un identifiant Google gratuit (≈ 10 min).",

        `Va dans ${ext("https://console.cloud.google.com/auth/clients", "Clients")} → <b>Créer un client</b> → type <b>Application de bureau</b> → Créer → <b>Télécharger le JSON</b>.`,

// Voix et modèles ElevenLabs : chargés une fois à l'ouverture de l'étape (hors du statut rafraîchi toutes les 4 s).
let ELC = null, elLoading = false;
async function loadEleven() {
  if (elLoading) return;
  elLoading = true;
  ELC = await api("/api/setup/elevenlabs/catalog").catch((e) => ({ error: e.message }));
  elLoading = false;
  if (step === VOICE_STEP) { render(true); bindAll(); } // toujours sur l'étape Voix off
}
const elVoice = (lang) => { const o = $(`#elV-${lang}`)?.selectedOptions[0]; return o?.value ? { id: o.value, name: o.dataset.name } : null; };

function render(force) {
  renderNav();
  if (!force && $("#main").contains(document.activeElement) && document.activeElement.tagName === "INPUT") return; // ne pas écraser une saisie
  $("#main").innerHTML = VIEWS[step]();
}
let lastRaw = "";
async function load(force) {
  const raw = await fetch("/api/setup/status").then((r) => r.text());
  if (!force && raw === lastRaw) return; // rien n'a changé : on garde la page (et les messages) telle quelle
  lastRaw = raw;
  ST = JSON.parse(raw);
  render(force);
}

/* ------------------------------------------------------------------ actions */
const msg = (id, ok, text) => { const el = $(id); el.className = `msg ${ok ? "ok" : "err"}`; el.innerHTML = text; };
async function uploadFile(url, file) { const fd = new FormData(); fd.append("file", file); return fetch(url, { method: "POST", body: fd }).then((r) => r.json()); }
function bindDrop(zoneId, inputId, onFile) {
  const z = $(zoneId); if (!z) return;
  z.ondragover = (e) => { e.preventDefault(); z.classList.add("over"); };
  z.ondragleave = () => z.classList.remove("over");
  z.ondrop = (e) => { e.preventDefault(); z.classList.remove("over"); if (e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]); };
  $(inputId).onchange = (e) => e.target.files[0] && onFile(e.target.files[0]);
}

document.body.addEventListener("click", async (e) => {
  const el = e.target.closest("[data-step],[data-go],[data-copy],[data-l],[data-el-preview],[data-el-test],[data-forget],#saveProfile,#saveTT,#saveIG,#saveHost,#privacy,#finish,#wCreate,#wOpen,#elSaveKey,#elForget,#elSave,#elAddBtn");
  if (!el) return;
  if (el.dataset.step ?? el.dataset.go) { step = Number(el.dataset.step ?? el.dataset.go); history.replaceState(null, "", `#${step}`); await load(true); bindAll(); window.scrollTo(0, 0); return; }
  if (el.dataset.copy) { await navigator.clipboard.writeText(el.dataset.copy); el.classList.add("done"); setTimeout(() => el.classList.remove("done"), 1500); return; }
  if (el.dataset.l) { L = el.dataset.l; try { localStorage.setItem("setupLang", L); } catch {} render(true); bindAll(); return; }
  if (el.id === "saveProfile") {
    await api("/api/setup/profile", { ownerName: $("#pName").value.trim(), lang: L, signature: { fr: $("#pFr").value.trim(), fr_vous: $("#pFrV").value.trim(), en: $("#pEn").value.trim() } });
    $("#profileMsg").textContent = t().s1.saved; ST = await api("/api/setup/status"); renderNav();
  }
  if (el.id === "saveTT") {
    const r = await api("/api/setup/tiktok", { clientKey: $("#ttKey").value, clientSecret: $("#ttSecret").value });
    if (r.error) return msg("#ttMsg", false, esc(r.error));
    await load(true); bindAll(); msg("#ttMsg", true, t().s4.saved);
  }
  if (el.dataset.forget) {
    if (!confirm(t().acc.forgetQ(el.dataset.lang.toUpperCase()))) return;
    await api(`/api/accounts/${el.dataset.forget}/${el.dataset.lang}/forget`, {});
    await load(true); bindAll(); return;
  }
  if (el.id === "saveIG") {
    const x = t().sI, label = el.textContent;
    el.disabled = true; el.textContent = x.saving;
    const r = await api("/api/setup/instagram", { lang: $("#igLang").value, accessToken: $("#igToken").value, appId: $("#igAppId").value });
    el.disabled = false; el.textContent = label;
    if (r.error) return msg("#igMsg", false, esc(r.error));
    await load(true); bindAll(); msg("#igMsg", true, x.saved(esc(r.username)));
  }
  if (el.id === "saveHost") {
    el.disabled = true; el.textContent = t().s5.testing;
    const r = await api("/api/setup/hosting", { protocol: $("#hProto").value, host: $("#hHost").value, port: $("#hPort").value, user: $("#hUser").value, password: $("#hPass").value, remoteDir: $("#hDir").value, publicBaseUrl: $("#hUrl").value });
    await load(true); bindAll();
    msg("#hMsg", !!r.ok, r.ok ? t().s5.ok : esc(r.error));
  }
  if (el.id === "privacy") {
    el.disabled = true;
    const r = await api("/api/setup/privacy", {});
    el.disabled = false;
    msg("#prMsg", !r.error && r.ok, r.error ? esc(r.error) : `${t().s5.privacyOk} <a href="${r.url}" target="_blank">${esc(r.url)}</a> — ${copy(r.url)}`);
  }
  if (el.id === "wCreate") {
    const r = await api("/api/setup/watch-folder", { dir: $("#wDir").value });
    await load(true); bindAll();
    msg("#wMsg", !r.error, r.error ? esc(r.error) : `${t().sW.created} ${esc(r.dir)}`);
  }
  if (el.id === "wOpen") await api("/api/setup/open-folder", {});
  if (el.id === "elSaveKey") {
    el.disabled = true;
    const r = await api("/api/setup/elevenlabs/key", { apiKey: $("#elKey").value });
    el.disabled = false;
    if (r.error) return msg("#elMsg", false, esc(r.error));
    ELC = null; await load(true); bindAll();
  }
  if (el.id === "elForget") { await api("/api/setup/elevenlabs/forget", {}); ELC = null; await load(true); bindAll(); }
  if (el.dataset.elPreview) {
    const lang = el.dataset.elPreview, v = ELC?.voices.find((x) => x.id === elVoice(lang)?.id), a = $("#elAudio");
    if (!v) return;
    a.src = v.previews[lang] ?? v.preview; a.style.display = "block"; a.play();
  }
  if (el.dataset.elTest) {
    const lang = el.dataset.elTest, v = elVoice(lang), x = t().sV;
    if (!v) return msg("#elVMsg", false, x.none);
    const label = el.textContent; el.disabled = true; el.textContent = x.testing;
    const r = await api("/api/setup/elevenlabs/test", { lang, voiceId: v.id, voiceName: v.name, model: $("#elModel").value, preset: $("#elPreset").value });
    el.disabled = false; el.textContent = label;
    if (r.error) return msg("#elVMsg", false, esc(r.error));
    const a = $("#elAudio"); a.src = r.audio; a.style.display = "block"; a.play();
    msg("#elVMsg", true, `« ${esc(r.text)} »${r.timestamps ? "" : `<br>${x.noTs}`}`);
  }
  if (el.id === "elAddBtn") {
    const x = t().sV, label = el.textContent, keep = { fr: elVoice("fr")?.id ?? "", en: elVoice("en")?.id ?? "", model: $("#elModel").value, preset: $("#elPreset").value };
    el.disabled = true; el.textContent = x.adding;
    const r = await api("/api/setup/elevenlabs/add-voice", { input: $("#elAdd").value });
    el.disabled = false; el.textContent = label;
    if (r.error) return msg("#elVMsg", false, esc(r.error));
    ELC = await api("/api/setup/elevenlabs/catalog");
    render(true); bindAll();
    // Le rendu repart des réglages enregistrés : on remet les choix en cours, puis la nouvelle voix dans sa langue.
    $("#elModel").value = keep.model; $("#elPreset").value = keep.preset; $("#elV-fr").value = keep.fr; $("#elV-en").value = keep.en;
    const langs = r.voice.langs ?? [];
    $(`#elV-${langs.includes("en") && !langs.includes("fr") ? "en" : "fr"}`).value = r.voice.id;
    msg("#elVMsg", true, x.added(esc(r.voice.name)));
  }
  if (el.id === "elSave") {
    await api("/api/setup/elevenlabs", { model: $("#elModel").value, preset: $("#elPreset").value, voices: { fr: elVoice("fr"), en: elVoice("en") } });
    ST = await api("/api/setup/status"); lastRaw = JSON.stringify(ST); renderNav();
    msg("#elVMsg", true, t().sV.saved);
  }
  if (el.id === "finish") { await api("/api/setup/profile", { setupDone: true }); location.href = "/"; }
});

function bindAll() {
  bindDrop("#ytDrop", "#ytFile", async (f) => {
    const r = await uploadFile("/api/setup/youtube-secret", f);
    if (r.error) return msg("#ytMsg", false, esc(r.error));
    await load(true); bindAll(); msg("#ytMsg", true, t().s3.secretOk);
  });
  bindDrop("#vDrop", "#vFile", async (f) => {
    const r = await uploadFile("/api/setup/hosting-file", f);
    msg("#vMsg", !r.error && r.ok, r.error ? esc(r.error) : r.ok ? `✓ <a href="${r.url}" target="_blank">${esc(r.url)}</a> — Verify ✓` : `${esc(r.url)} → HTTP ${r.status}`);
  });
}

(async () => {
  sessionStorage.setItem("skipSetup", "1"); // le dashboard reste accessible pendant l'installation
  await load(true);
  bindAll();
  setInterval(() => { if (!document.hidden) load(false).then(() => { if (!$("#main").contains(document.activeElement)) bindAll(); }); }, 4000);
})();
</script>
